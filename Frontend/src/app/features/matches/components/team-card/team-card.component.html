<article class="team-card">
  <img
    class="team-card__flag"
    [src]="'https://flagcdn.com/w20/' + team.code.toLowerCase() + '.png'"
    [srcset]="'https://flagcdn.com/w40/' + team.code.toLowerCase() + '.png 2x'"
    [alt]="team.name"
    width="20"
    height="15"
  />
  <div class="team-card__body">
    <span class="team-card__name">{{ team.name }}</span>
    <span class="team-card__code">{{ team.code }}</span>
  </div>
  @if (isEditing) {
    <div class="team-card__goals">
      <input
        type="number"
        min="0"
        max="15"
        [value]="goals"
        (change)="onGoalsChange($event)"
        class="team-card__input"
        aria-label="Goles"
      />
    </div>
  } @else if (!isEditing && goals > 0) {
    <div class="team-card__goals">
      <span class="team-card__goals-display">{{ goals }}</span>
    </div>
  }
</article>
